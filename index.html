<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Daily Navigator — 밥부터 먹고 놀자</title>
<meta name="description" content="오늘의 운동·영어·독서, 남은 밥의 양을 보여주는 시간 내비게이션" />
<meta name="theme-color" content="#F6EFE1" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Song+Myung&family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --rice-bowl: #E7DAC0;
    --rice-inner: #2A2420;
    --rice-grain: #FAF4E6;
    --paper: #F6EFE1;
    --paper-2: #EFE5D2;
    --ink: #2A2420;
    --ink-soft: #6B6154;
    --clay: #BE6E3E;
    --clay-deep: #9C572E;
    --celadon: #7B9583;
    --celadon-deep: #5E7C6B;
    --soy: #8A5A38;
    --line: rgba(42,36,32,0.12);
    --done: #6E8F5C;
    --radius-bowl: 28px;
    --shadow: 0 18px 40px -22px rgba(42,36,32,0.35);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, #FBF6EA 0%, transparent 60%),
      radial-gradient(900px 500px at 110% 10%, #F1E4CC 0%, transparent 55%),
      var(--paper);
    color:var(--ink);
    font-family:"Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  .display{
    font-family:"Song Myung", "Noto Sans KR", serif;
  }

  body{ min-height:100dvh; }

  .wrap{
    max-width:480px;
    margin:0 auto;
    padding:28px 20px 64px;
  }

  /* ---------- header ---------- */
  header.top{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:22px;
  }
  header.top .date{
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }
  header.top .brand{
    font-size:14px;
    font-weight:700;
    color:var(--clay-deep);
  }

  /* ---------- hero: bowl ---------- */
  .hero{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8px 0 6px;
  }
  .hero .tagline{
    font-family:"Song Myung", serif;
    font-size:26px;
    line-height:1.4;
    text-align:center;
    margin:2px 0 20px;
    color:var(--ink);
  }
  .hero .tagline .accent{
    color:var(--clay-deep);
  }

  .bowl-stage{
    position:relative;
    width:220px;
    height:220px;
  }
  .bowl-stage svg{ width:100%; height:100%; display:block; }

  .fill-clip{
    transition: transform 900ms cubic-bezier(.22,.9,.24,1);
    transform-box: fill-box;
    transform-origin: center;
  }

  .steam{
    transform-origin: center bottom;
    animation: steam 3.2s ease-in-out infinite;
    opacity:0.55;
  }
  .steam.s2{ animation-delay:.9s; }
  .steam.s3{ animation-delay:1.7s; }
  @keyframes steam{
    0%{ transform:translateY(0) scaleY(1); opacity:0; }
    18%{ opacity:.6; }
    100%{ transform:translateY(-26px) scaleY(1.25); opacity:0; }
  }
  @media (prefers-reduced-motion: reduce){
    .steam{ animation:none; opacity:.35; }
    .fill-clip{ transition:none; }
  }

  .percent-label{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%,-38%);
    text-align:center;
    pointer-events:none;
  }
  .percent-label .num{
    font-family:"Song Myung", serif;
    font-size:30px;
    color:var(--rice-grain);
  }
  .percent-label .sub{
    font-size:11px;
    color:var(--rice-grain);
    opacity:.85;
    letter-spacing:0.03em;
  }

  .remain-row{
    margin-top:18px;
    text-align:center;
  }
  .remain-row .big{
    font-family:"Song Myung", serif;
    font-size:22px;
  }
  .remain-row .big b{
    color:var(--clay-deep);
    font-size:30px;
    font-weight:400;
  }
  .remain-row .tip{
    margin-top:4px;
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ---------- celebration banner ---------- */
  .celebrate{
    display:none;
    margin:22px 0 6px;
    padding:18px 18px;
    border-radius:20px;
    background:linear-gradient(135deg, #EFE6CE, #E9DCC0);
    border:1px solid var(--line);
    text-align:center;
  }
  .celebrate.show{ display:block; }
  .celebrate .headline{
    font-family:"Song Myung", serif;
    font-size:20px;
    color:var(--clay-deep);
    margin-bottom:4px;
  }
  .celebrate .sub{
    font-size:12.5px;
    color:var(--ink-soft);
  }

  /* ---------- activity cards ---------- */
  .meals{
    margin-top:26px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .card{
    position:relative;
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:22px;
    padding:18px 18px 16px;
    overflow:hidden;
  }
  .card.done{
    background:linear-gradient(180deg, #E4EEE0, #DCE9D6);
    border-color:rgba(110,143,92,0.35);
  }

  .card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .card-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15.5px;
    font-weight:700;
  }
  .card-icon{ width:26px; height:26px; flex:none; }
  .status-chip{
    font-size:11.5px;
    padding:4px 10px;
    border-radius:999px;
    color:var(--ink-soft);
    background:rgba(42,36,32,0.06);
  }
  .status-chip.done{
    color:#31502A;
    background:rgba(110,143,92,0.22);
  }
  .status-chip.running{
    color:var(--clay-deep);
    background:rgba(190,110,62,0.15);
  }

  .progress-line{
    height:8px;
    border-radius:999px;
    background:rgba(42,36,32,0.08);
    overflow:hidden;
    margin:10px 0 8px;
  }
  .progress-fill{
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg, var(--clay), var(--clay-deep));
    width:0%;
    transition:width .5s ease;
  }
  .card.done .progress-fill{ background:linear-gradient(90deg, var(--done), var(--celadon-deep)); }
  .card.exercise .progress-fill{ background:linear-gradient(90deg, #B08256, var(--soy)); }

  .card-meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink-soft);
  }
  .card-meta .count b{
    color:var(--ink);
    font-weight:700;
    font-size:15px;
  }

  .timer-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:14px;
  }
  .timer-display{
    font-variant-numeric: tabular-nums;
    font-size:22px;
    font-weight:700;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  .timer-display.idle{ color:var(--ink-soft); font-weight:500; font-size:14px; }

  .btns{ display:flex; gap:8px; }
  button{
    font-family:inherit;
    border:none;
    cursor:pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn{
    font-size:13px;
    font-weight:700;
    padding:9px 14px;
    border-radius:12px;
    background:var(--clay);
    color:#FFF6EC;
  }
  .btn:active{ transform:scale(.97); }
  .btn.secondary{
    background:rgba(42,36,32,0.08);
    color:var(--ink);
  }
  .btn.stop{
    background:#3B332C;
    color:#FDF8ED;
  }
  .btn.finish{
    background:var(--celadon-deep);
    color:#F4FAF1;
  }
  .card.done .btn{
    background:rgba(42,36,32,0.08);
    color:var(--ink-soft);
  }

  .manual-add{
    display:flex;
    align-items:center;
    gap:8px;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .manual-add label{
    font-size:12px;
    color:var(--ink-soft);
    flex:none;
  }
  .manual-add input{
    width:64px;
    font-family:inherit;
    font-size:14px;
    padding:7px 8px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#FDF9F0;
    color:var(--ink);
  }
  .manual-add input:focus{ outline:2px solid var(--clay); outline-offset:1px; }
  .manual-add .btn{ padding:7px 12px; font-size:12.5px; }

  /* exercise specific: elapsed breakdown */
  .exercise-note{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:8px;
  }

  /* ---------- edit ---------- */
  .icon-btn{
    width:26px; height:26px;
    border-radius:8px;
    background:rgba(42,36,32,0.06);
    color:var(--ink-soft);
    font-size:13px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    margin-left:6px;
  }
  .icon-btn:active{ transform:scale(.94); }
  .head-right{ display:flex; align-items:center; }

  .edit-panel{
    display:none;
    margin-top:12px;
    padding-top:12px;
    border-top:1px dashed var(--line);
  }
  .edit-panel.open{ display:block; }
  .edit-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .edit-row input[type="number"]{
    width:70px;
    font-family:inherit;
    font-size:14px;
    padding:7px 8px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#FDF9F0;
    color:var(--ink);
  }
  .edit-check{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:13px;
    margin-bottom:10px;
  }
  .edit-check input{ width:16px; height:16px; accent-color:var(--clay-deep); }
  .edit-actions{ display:flex; gap:8px; }
  .edit-actions .btn{ padding:8px 14px; }

  /* ---------- history / stats ---------- */
  .history{
    margin-top:30px;
  }
  .history-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .history-title{
    font-family:"Song Myung", serif;
    font-weight:400;
    font-size:17px;
    margin:0;
  }
  .history-stats{
    font-size:12px;
    color:var(--ink-soft);
  }
  .history-stats .dot-sep{ margin:0 6px; opacity:.5; }
  .history-stats b{ color:var(--clay-deep); font-weight:700; }

  .history-list{
    border-top:1px solid var(--line);
  }
  .history-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 2px;
    border-bottom:1px solid var(--line);
    font-size:13px;
  }
  .history-row.today .h-date{ color:var(--clay-deep); font-weight:700; }
  .h-date{
    flex:0 0 68px;
    color:var(--ink-soft);
  }
  .h-dots{
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .h-dot{
    width:9px; height:9px;
    border-radius:50%;
    display:inline-block;
    background:rgba(42,36,32,0.10);
    border:1px solid rgba(42,36,32,0.14);
  }
  .h-dot.partial{ background:var(--clay); border-color:var(--clay); }
  .h-dot.done{ background:var(--done); border-color:var(--done); }
  .h-overall{
    margin-left:auto;
    font-size:12px;
    color:var(--ink-soft);
    text-align:right;
  }
  .h-overall.complete{ color:#31502A; font-weight:700; }
  .h-legend{
    display:flex;
    gap:14px;
    margin-top:10px;
    font-size:11px;
    color:var(--ink-soft);
  }
  .h-legend span{ display:flex; align-items:center; gap:5px; }

  footer.philosophy{
    margin-top:34px;
    text-align:center;
    padding-top:20px;
    border-top:1px solid var(--line);
  }
  footer.philosophy p{
    font-family:"Song Myung", serif;
    font-size:14.5px;
    line-height:1.9;
    color:var(--ink-soft);
    margin:0;
  }
  footer.philosophy .rice{ color:var(--clay-deep); }

  .reset-link{
    display:block;
    text-align:center;
    margin-top:16px;
    font-size:11.5px;
    color:var(--ink-soft);
    text-decoration:underline;
    background:none;
    width:100%;
  }

  @media (max-width:360px){
    .bowl-stage{ width:190px; height:190px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <span class="brand">🍚 Daily Navigator</span>
    <span class="date" id="todayLabel">-</span>
  </header>

  <section class="hero">
    <p class="tagline">밥부터 먹고, <span class="accent">놀자</span></p>

    <div class="bowl-stage">
      <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
          <clipPath id="bowlClip">
            <path d="M32 78 C32 78 40 150 100 150 C160 150 168 78 168 78 Z" />
          </clipPath>
          <radialGradient id="riceGrad" cx="45%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFFCF4" />
            <stop offset="100%" stop-color="#F0E2C0" />
          </radialGradient>
          <linearGradient id="bowlGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#EFE1C4" />
            <stop offset="100%" stop-color="#D8C49E" />
          </linearGradient>
        </defs>

        <!-- steam -->
        <g fill="none" stroke="#C9BBA0" stroke-width="4" stroke-linecap="round" opacity=".6">
          <path class="steam s1" d="M78 62 C 72 52, 84 46, 78 36" />
          <path class="steam s2" d="M100 58 C 94 48, 106 42, 100 32" />
          <path class="steam s3" d="M122 62 C 116 52, 128 46, 122 36" />
        </g>

        <!-- bowl body -->
        <path d="M24 76 C24 76 32 158 100 158 C168 158 176 76 176 76 Z" fill="url(#bowlGrad)" stroke="#B79E75" stroke-width="2"/>
        <!-- rim -->
        <ellipse cx="100" cy="76" rx="76" ry="15" fill="#F3E6C9" stroke="#B79E75" stroke-width="2"/>
        <ellipse cx="100" cy="74" rx="68" ry="11" fill="#FBF3DE"/>

        <!-- rice fill, clipped, translated by JS via CSS var -->
        <g id="fillGroup" class="fill-clip" clip-path="url(#bowlClip)">
          <rect id="riceRect" x="20" y="10" width="160" height="160" fill="url(#riceGrad)"/>
          <!-- grain texture dots -->
          <g fill="#E7D6AC" opacity=".55">
            <circle cx="55" cy="95" r="2.4"/><circle cx="72" cy="108" r="2"/><circle cx="90" cy="92" r="2.6"/>
            <circle cx="110" cy="104" r="2.1"/><circle cx="128" cy="94" r="2.4"/><circle cx="145" cy="106" r="2"/>
            <circle cx="65" cy="120" r="2.2"/><circle cx="100" cy="122" r="2.5"/><circle cx="135" cy="118" r="2.1"/>
          </g>
        </g>

        <!-- chopsticks -->
        <g transform="rotate(24 150 40)">
          <rect x="146" y="8" width="4.5" height="72" rx="2.2" fill="#8A5A38"/>
          <rect x="155" y="8" width="4.5" height="72" rx="2.2" fill="#9C6B48"/>
        </g>
      </svg>

      <div class="percent-label">
        <div class="num" id="percentNum">0%</div>
        <div class="sub">오늘의 밥</div>
      </div>
    </div>

    <div class="remain-row">
      <div class="big">남은 밥 <b id="remainMinutes">0</b>분</div>
      <div class="tip" id="recommendTip">영어 권장 마감 21:00</div>
    </div>
  </section>

  <div class="celebrate" id="celebrate">
    <div class="headline">🎉 오늘 밥 다 먹었습니다</div>
    <div class="sub">이제부터 남은 시간은 온전히 당신의 것입니다.</div>
  </div>

  <section class="meals">

    <!-- 운동 -->
    <article class="card exercise" id="card-exercise">
      <div class="card-head">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none"><circle cx="17" cy="4.5" r="2.3" fill="#8A5A38"/><path d="M14 21l1.6-6.2-2.3-2-.3-3.4 3.1 2.6 2.6-.2 3.4 3.4-1.4 1.4-2.6-2.6-1.7.1 1.4 5.3 3.6 3.4-1.5 1.5-4-3.8-3-1.2-2.4 4.3-1.7-.9 2.6-4.7-1-3.9-3 1.6-1.7 3.2 2 1.2-1.6z" fill="#8A5A38"/></svg>
          운동
        </div>
        <div class="head-right">
          <span class="status-chip" id="chip-exercise">대기</span>
          <button class="icon-btn" data-act="exercise-edit-toggle" aria-label="운동 기록 수정">✎</button>
        </div>
      </div>
      <div class="progress-line"><div class="progress-fill" id="fill-exercise"></div></div>
      <div class="card-meta">
        <span class="count" id="meta-exercise">아직 시작 전</span>
        <span id="meta-exercise-side"></span>
      </div>
      <div class="timer-row">
        <span class="timer-display idle" id="timer-exercise">00:00</span>
        <div class="btns" id="btns-exercise">
          <button class="btn" data-act="exercise-start">START</button>
        </div>
      </div>
      <p class="exercise-note">준비·운동·정리·샤워까지 실제 소요시간을 기록해요.</p>

      <div class="edit-panel" id="edit-exercise">
        <label class="edit-check"><input type="checkbox" id="edit-exercise-done" /> 완료로 표시</label>
        <div class="edit-row">
          <label>실제 소요시간</label>
          <input type="number" min="0" id="edit-exercise-minutes" />분
        </div>
        <div class="edit-actions">
          <button class="btn" data-act="exercise-edit-save">저장</button>
          <button class="btn secondary" data-act="exercise-edit-cancel">취소</button>
        </div>
      </div>
    </article>

    <!-- 영어 -->
    <article class="card" id="card-english">
      <div class="card-head">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none"><path d="M12 2c3 4 5 7 5 10.5A5 5 0 0 1 7 12.5C7 9 9 6 12 2Z" fill="#BE6E3E"/><path d="M12 22c-2.2 0-4-1.6-4-3.6 0-1.4 1-2.4 2-3.4" stroke="#9C572E" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
          영어
        </div>
        <div class="head-right">
          <span class="status-chip" id="chip-english">대기</span>
          <button class="icon-btn" data-act="english-edit-toggle" aria-label="영어 기록 수정">✎</button>
        </div>
      </div>
      <div class="progress-line"><div class="progress-fill" id="fill-english"></div></div>
      <div class="card-meta">
        <span class="count"><b id="meta-english-cur">0</b> / 180분</span>
        <span id="meta-english-left">180분 남음</span>
      </div>
      <div class="timer-row">
        <span class="timer-display idle" id="timer-english">00:00</span>
        <div class="btns" id="btns-english">
          <button class="btn" data-act="english-start">START</button>
        </div>
      </div>
      <div class="manual-add">
        <label>직접 입력</label>
        <input type="number" min="1" id="manual-english" placeholder="분" />
        <button class="btn secondary" data-act="english-manual">추가</button>
      </div>

      <div class="edit-panel" id="edit-english">
        <div class="edit-row">
          <label>정확한 누적시간</label>
          <input type="number" min="0" id="edit-english-minutes" />분
        </div>
        <div class="edit-actions">
          <button class="btn" data-act="english-edit-save">저장</button>
          <button class="btn secondary" data-act="english-edit-cancel">취소</button>
        </div>
      </div>
    </article>

    <!-- 독서 -->
    <article class="card" id="card-reading">
      <div class="card-head">
        <div class="card-title">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none"><path d="M3 5.5C5 4.3 8 4 11 5v14c-3-1-6-.7-8 .5v-14Z" fill="#7B9583"/><path d="M21 5.5c-2-1.2-5-1.5-8-.5v14c3-1 6-.7 8 .5v-14Z" fill="#5E7C6B"/></svg>
          독서
        </div>
        <div class="head-right">
          <span class="status-chip" id="chip-reading">대기</span>
          <button class="icon-btn" data-act="reading-edit-toggle" aria-label="독서 기록 수정">✎</button>
        </div>
      </div>
      <div class="progress-line"><div class="progress-fill" id="fill-reading"></div></div>
      <div class="card-meta">
        <span class="count"><b id="meta-reading-cur">0</b> / 30분</span>
        <span id="meta-reading-left">30분 남음</span>
      </div>
      <div class="timer-row">
        <span class="timer-display idle" id="timer-reading">00:00</span>
        <div class="btns" id="btns-reading">
          <button class="btn" data-act="reading-start">START</button>
        </div>
      </div>
      <div class="manual-add">
        <label>직접 입력</label>
        <input type="number" min="1" id="manual-reading" placeholder="분" />
        <button class="btn secondary" data-act="reading-manual">추가</button>
      </div>

      <div class="edit-panel" id="edit-reading">
        <div class="edit-row">
          <label>정확한 누적시간</label>
          <input type="number" min="0" id="edit-reading-minutes" />분
        </div>
        <div class="edit-actions">
          <button class="btn" data-act="reading-edit-save">저장</button>
          <button class="btn secondary" data-act="reading-edit-cancel">취소</button>
        </div>
      </div>
    </article>

  </section>

  <section class="history" id="historySection">
    <div class="history-head">
      <h2 class="history-title">지난 기록</h2>
      <div class="history-stats">
        연속 <b id="streakStat">0</b>일 <span class="dot-sep">·</span> 최근 7일 <b id="weekStat">0</b>일 완료
      </div>
    </div>
    <div class="history-list" id="historyList"></div>
    <div class="h-legend">
      <span><i class="h-dot"></i>안 함</span>
      <span><i class="h-dot partial"></i>일부</span>
      <span><i class="h-dot done"></i>완료</span>
    </div>
  </section>

  <footer class="philosophy">
    <p><span class="rice">🍚</span> 시간이 생기면 먹고, 몰입되면 많이 먹고,<br/>끊기면 나중에 다시 먹는다.</p>
  </footer>

  <button class="reset-link" id="resetDay">오늘 기록 초기화</button>

</div>

<script>
(function(){
  const TARGETS = { english: 180, reading: 30 };
  const RECOMMEND_HOUR = 21;

  function todayKey(){
    const d = new Date();
    return `dn-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function todayLabel(){
    const d = new Date();
    const days = ['일','월','화','수','목','금','토'];
    return `${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
  }

  function defaultState(){
    return {
      exercise: { done:false, minutes:0, running:false, startedAt:null },
      english:  { minutes:0, running:false, startedAt:null },
      reading:  { minutes:0, running:false, startedAt:null }
    };
  }

  let state = load();

  function load(){
    try{
      const raw = localStorage.getItem(todayKey());
      if(raw) return JSON.parse(raw);
    }catch(e){}
    return defaultState();
  }
  function save(){
    try{ localStorage.setItem(todayKey(), JSON.stringify(state)); }catch(e){}
  }

  document.getElementById('todayLabel').textContent = todayLabel();

  function fmt(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return `${m}:${s}`;
  }

  function elapsedSecFor(item){
    if(!item.running || !item.startedAt) return 0;
    return Math.floor((Date.now() - item.startedAt)/1000);
  }

  function currentMinutes(item){
    return item.minutes + elapsedSecFor(item)/60;
  }

  function render(){
    // ---- english ----
    const engCur = Math.floor(currentMinutes(state.english));
    const engPct = Math.min(100, (engCur/TARGETS.english)*100);
    document.getElementById('fill-english').style.width = engPct+'%';
    document.getElementById('meta-english-cur').textContent = engCur;
    const engLeft = Math.max(0, TARGETS.english - engCur);
    document.getElementById('meta-english-left').textContent = engLeft>0 ? `${engLeft}분 남음` : '완료';
    setChip('english', engLeft<=0, state.english.running);
    document.getElementById('card-english').classList.toggle('done', engLeft<=0);

    // ---- reading ----
    const readCur = Math.floor(currentMinutes(state.reading));
    const readPct = Math.min(100, (readCur/TARGETS.reading)*100);
    document.getElementById('fill-reading').style.width = readPct+'%';
    document.getElementById('meta-reading-cur').textContent = readCur;
    const readLeft = Math.max(0, TARGETS.reading - readCur);
    document.getElementById('meta-reading-left').textContent = readLeft>0 ? `${readLeft}분 남음` : '완료';
    setChip('reading', readLeft<=0, state.reading.running);
    document.getElementById('card-reading').classList.toggle('done', readLeft<=0);

    // ---- exercise ----
    const exMinutesNow = state.exercise.running
      ? state.exercise.minutes + elapsedSecFor(state.exercise)/60
      : state.exercise.minutes;
    document.getElementById('fill-exercise').style.width = (state.exercise.done ? 100 : (state.exercise.running? 40:0)) + '%';
    document.getElementById('meta-exercise').textContent = state.exercise.done
      ? `완료 · 실제 ${Math.round(state.exercise.minutes)}분 사용`
      : (state.exercise.running ? '진행 중 (준비~운동~정리 포함)' : '아직 시작 전');
    setChip('exercise', state.exercise.done, state.exercise.running);
    document.getElementById('card-exercise').classList.toggle('done', state.exercise.done);

    // ---- timers ----
    updateTimerDisplay('english', state.english);
    updateTimerDisplay('reading', state.reading);
    updateTimerDisplay('exercise', state.exercise, exMinutesNow*60);

    // ---- buttons ----
    renderButtons('english', state.english, engLeft<=0);
    renderButtons('reading', state.reading, readLeft<=0);
    renderExerciseButtons();

    // ---- bowl fill % ----
    const exFrac = state.exercise.done ? 1 : 0;
    const engFrac = Math.min(1, engCur/TARGETS.english);
    const readFrac = Math.min(1, readCur/TARGETS.reading);
    const overall = Math.round(((exFrac+engFrac+readFrac)/3)*100);
    document.getElementById('percentNum').textContent = overall+'%';
    // rice height: 0% -> fully lowered (empty), 100% -> risen to rim
    const riseMax = 128; // px translate range: rect top(10) must clear clip bottom(~150) when empty
    const translateY = riseMax - (riseMax * overall/100);
    document.getElementById('fillGroup').style.transform = `translateY(${translateY}px)`;

    // ---- remaining minutes summary ----
    const remain = engLeft + readLeft;
    document.getElementById('remainMinutes').textContent = remain;

    const now = new Date();
    const hh = now.getHours();
    if(engLeft<=0){
      document.getElementById('recommendTip').textContent = '영어 완료 · 오늘 잘 챙겼어요';
    } else if(hh >= RECOMMEND_HOUR){
      document.getElementById('recommendTip').textContent = `영어 ${engLeft}분 남음 · 권장 마감시간이 지났어요`;
    } else {
      document.getElementById('recommendTip').textContent = `영어 ${engLeft}분 남음 · 권장 마감 21:00`;
    }

    // ---- celebration ----
    const allDone = state.exercise.done && engLeft<=0 && readLeft<=0;
    document.getElementById('celebrate').classList.toggle('show', allDone);

    renderHistory();
  }

  function setChip(key, done, running){
    const el = document.getElementById('chip-'+key);
    el.classList.remove('done','running');
    if(done){ el.textContent='완료'; el.classList.add('done'); }
    else if(running){ el.textContent='진행 중'; el.classList.add('running'); }
    else { el.textContent='대기'; }
  }

  function updateTimerDisplay(key, item, overrideSec){
    const el = document.getElementById('timer-'+key);
    if(item.running){
      const sec = overrideSec!==undefined ? overrideSec : (item.minutes*60 + elapsedSecFor(item));
      el.textContent = fmt(overrideSec!==undefined ? elapsedSecFor(item) : elapsedSecFor(item));
      el.classList.remove('idle');
    } else {
      el.textContent = '00:00';
      el.classList.add('idle');
    }
  }

  function renderButtons(key, item, done){
    const wrap = document.getElementById('btns-'+key);
    wrap.innerHTML = '';
    if(done && !item.running){
      return; // no buttons needed once complete
    }
    if(item.running){
      const stop = document.createElement('button');
      stop.className='btn stop'; stop.dataset.act=key+'-stop'; stop.textContent='STOP';
      wrap.appendChild(stop);
    } else {
      const start = document.createElement('button');
      start.className='btn'; start.dataset.act=key+'-start'; start.textContent='START';
      wrap.appendChild(start);
    }
  }

  function renderExerciseButtons(){
    const wrap = document.getElementById('btns-exercise');
    wrap.innerHTML = '';
    if(state.exercise.done) return;
    if(state.exercise.running){
      const finish = document.createElement('button');
      finish.className='btn finish'; finish.dataset.act='exercise-finish'; finish.textContent='완료';
      wrap.appendChild(finish);
    } else {
      const start = document.createElement('button');
      start.className='btn'; start.dataset.act='exercise-start'; start.textContent='START';
      wrap.appendChild(start);
    }
  }

  // ---- actions ----
  function startTimer(key){
    const item = state[key];
    if(item.running) return;
    item.running = true;
    item.startedAt = Date.now();
    save(); render();
  }
  function stopTimer(key){
    const item = state[key];
    if(!item.running) return;
    const sec = elapsedSecFor(item);
    item.minutes += sec/60;
    item.running = false;
    item.startedAt = null;
    save(); render();
  }
  function finishExercise(){
    const item = state.exercise;
    if(item.running){
      const sec = elapsedSecFor(item);
      item.minutes += sec/60;
    }
    item.running = false;
    item.startedAt = null;
    item.done = true;
    save(); render();
  }
  function manualAdd(key){
    const input = document.getElementById('manual-'+key);
    const v = parseFloat(input.value);
    if(!v || v<=0) return;
    state[key].minutes += v;
    input.value='';
    save(); render();
  }

  // ---- edit panels ----
  function closeEdit(key){
    document.getElementById('edit-'+key).classList.remove('open');
  }
  function openEdit(key){
    // stop any running timer first so the numbers being edited are stable
    if(state[key] && state[key].running) stopTimer(key);
    if(key==='exercise'){
      document.getElementById('edit-exercise-done').checked = state.exercise.done;
      document.getElementById('edit-exercise-minutes').value = Math.round(state.exercise.minutes);
    } else {
      document.getElementById('edit-'+key+'-minutes').value = Math.round(state[key].minutes);
    }
    document.getElementById('edit-'+key).classList.add('open');
  }
  function toggleEdit(key){
    const panel = document.getElementById('edit-'+key);
    if(panel.classList.contains('open')) closeEdit(key);
    else openEdit(key);
  }
  function saveExerciseEdit(){
    const done = document.getElementById('edit-exercise-done').checked;
    const mins = parseFloat(document.getElementById('edit-exercise-minutes').value);
    state.exercise.minutes = isNaN(mins) ? 0 : Math.max(0, mins);
    state.exercise.done = done;
    state.exercise.running = false;
    state.exercise.startedAt = null;
    save(); closeEdit('exercise'); render(); renderHistory();
  }
  function saveTimeEdit(key){
    const mins = parseFloat(document.getElementById('edit-'+key+'-minutes').value);
    state[key].minutes = isNaN(mins) ? 0 : Math.max(0, mins);
    state[key].running = false;
    state[key].startedAt = null;
    save(); closeEdit(key); render(); renderHistory();
  }

  // ---- history / stats ----
  function pad2(n){ return String(n).padStart(2,'0'); }
  function keyForDate(d){ return `dn-${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function labelForDate(d, isToday){
    const days = ['일','월','화','수','목','금','토'];
    return isToday ? '오늘' : `${d.getMonth()+1}/${d.getDate()}(${days[d.getDay()]})`;
  }
  function readDay(d){
    try{
      const raw = localStorage.getItem(keyForDate(d));
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ return null; }
  }
  function dayStatus(rec){
    if(!rec) return null;
    const exS = rec.exercise.done ? 'done' : (rec.exercise.minutes>0 ? 'partial' : 'none');
    const enM = rec.english.minutes;
    const enS = enM>=TARGETS.english ? 'done' : (enM>0 ? 'partial' : 'none');
    const rdM = rec.reading.minutes;
    const rdS = rdM>=TARGETS.reading ? 'done' : (rdM>0 ? 'partial' : 'none');
    const complete = exS==='done' && enS==='done' && rdS==='done';
    return { exS, enS, rdS, complete };
  }
  function dayComplete(d){
    const st = dayStatus(readDay(d));
    return !!(st && st.complete);
  }

  function renderHistory(){
    const list = document.getElementById('historyList');
    list.innerHTML = '';
    const today = new Date();
    for(let i=0;i<14;i++){
      const d = new Date();
      d.setDate(today.getDate()-i);
      const isToday = i===0;
      const rec = isToday ? state : readDay(d);
      const st = dayStatus(rec);
      const row = document.createElement('div');
      row.className = 'history-row' + (isToday?' today':'');
      const overallText = !st ? '기록 없음' : (st.complete ? '🍚 완료' : '미완료');
      row.innerHTML = `
        <span class="h-date">${labelForDate(d, isToday)}</span>
        <span class="h-dots">
          <i class="h-dot ${st? st.exS : ''}" title="운동"></i>
          <i class="h-dot ${st? st.enS : ''}" title="영어"></i>
          <i class="h-dot ${st? st.rdS : ''}" title="독서"></i>
        </span>
        <span class="h-overall ${st && st.complete ? 'complete':''}">${overallText}</span>
      `;
      list.appendChild(row);
    }

    // streak: consecutive complete days ending today (or yesterday if today not yet complete)
    let streak = 0;
    let cursor = new Date();
    if(!dayComplete(cursor)) cursor.setDate(cursor.getDate()-1);
    while(true){
      if(dayComplete(cursor)){ streak++; cursor.setDate(cursor.getDate()-1); }
      else break;
      if(streak>365) break;
    }
    document.getElementById('streakStat').textContent = streak;

    // last 7 days completed count (including today)
    let weekCount = 0;
    for(let i=0;i<7;i++){
      const d = new Date();
      d.setDate(today.getDate()-i);
      if(dayComplete(d)) weekCount++;
    }
    document.getElementById('weekStat').textContent = weekCount;
  }

  document.body.addEventListener('click', (e)=>{
    const btn = e.target.closest('[data-act]');
    if(!btn) return;
    const act = btn.dataset.act;
    if(act==='exercise-start') startTimer('exercise');
    else if(act==='exercise-finish') finishExercise();
    else if(act==='english-start') startTimer('english');
    else if(act==='english-stop') stopTimer('english');
    else if(act==='english-manual') manualAdd('english');
    else if(act==='reading-start') startTimer('reading');
    else if(act==='reading-stop') stopTimer('reading');
    else if(act==='reading-manual') manualAdd('reading');
    else if(act==='exercise-edit-toggle') toggleEdit('exercise');
    else if(act==='exercise-edit-save') saveExerciseEdit();
    else if(act==='exercise-edit-cancel') closeEdit('exercise');
    else if(act==='english-edit-toggle') toggleEdit('english');
    else if(act==='english-edit-save') saveTimeEdit('english');
    else if(act==='english-edit-cancel') closeEdit('english');
    else if(act==='reading-edit-toggle') toggleEdit('reading');
    else if(act==='reading-edit-save') saveTimeEdit('reading');
    else if(act==='reading-edit-cancel') closeEdit('reading');
  });

  document.getElementById('resetDay').addEventListener('click', ()=>{
    if(confirm('오늘의 기록을 초기화할까요?')){
      state = defaultState();
      save(); render();
    }
  });

  setInterval(render, 1000);
  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', ()=>{
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
